<style>
  #records-filter-mock { --paper:light-dark(#fff,#181818); --ink:light-dark(#222,#eee); --line:light-dark(#aaa,#777); --quiet:light-dark(#555,#bbb); --red:light-dark(#ac5962,#f0a1a7); --green:light-dark(#4f8060,#a8d8b2); --blue:light-dark(#2864ad,#8dbbff); color:var(--ink); font:14px/1.4 Arial,sans-serif; }
  #records-filter-mock * { box-sizing:border-box; }
  #records-filter-mock .phone { max-width:420px; margin:auto; background:var(--paper); border:1px solid var(--ink); }
  #records-filter-mock header { padding:14px; border-bottom:1px solid var(--ink); display:flex; align-items:center; gap:10px; }
  #records-filter-mock svg { display:block; width:18px; height:18px; flex-shrink:0; }
  #records-filter-mock .body { padding:14px; }
  #records-filter-mock .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #records-filter-mock .row + .row { margin-top:8px; }
  #records-filter-mock .muted { color:var(--quiet); font-size:12px; }
  #records-filter-mock .income { color:var(--green); }
  #records-filter-mock .expense { color:var(--red); }
  #records-filter-mock .summary { padding:12px 0 16px; border-bottom:1px solid var(--line); }
  #records-filter-mock .group { margin:16px 0 10px; }
  #records-filter-mock .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  #records-filter-mock .search { display:flex; align-items:center; gap:8px; flex:1; min-width:0; padding:10px; border:1px solid var(--line); }
  #records-filter-mock .search span { min-width:0; font-size:12px; color:var(--quiet); }
  #records-filter-mock .filter { display:flex; align-items:center; gap:7px; padding:10px; border:1px solid var(--ink); white-space:nowrap; }
  #records-filter-mock button { background:var(--paper); color:var(--ink); font:inherit; border-radius:0; }
  #records-filter-mock .search input { width:100%; min-width:0; border:0; background:var(--paper); color:var(--ink); font:14px Arial,sans-serif; padding:0; }
  #records-filter-mock .filter-panel { border:1px solid var(--line); padding:12px; margin:-8px 0 18px; }
  #records-filter-mock label { display:block; font-size:12px; color:var(--quiet); margin-bottom:10px; }
  #records-filter-mock select, #records-filter-mock input[type="date"] { display:block; width:100%; min-width:0; min-height:40px; border:1px solid var(--line); border-radius:0; background:var(--paper); color:var(--ink); font:16px Arial,sans-serif; padding:7px; margin-top:4px; }
  #records-filter-mock .filter-panel button { border:1px solid var(--line); min-height:40px; padding:8px 12px; }
  #records-filter-mock [hidden] { display:none; }
  #records-filter-mock .item { border-bottom:1px solid var(--line); padding:12px 0; }
  #records-filter-mock .item .muted { margin-top:5px; }
  #records-filter-mock .category { display:flex; align-items:center; gap:8px; }
  #records-filter-mock .category svg { padding:6px; width:28px; height:28px; background:var(--chip,light-dark(#f7d5be,#a75b48)); }
  #records-filter-mock .add { border:1px solid var(--blue); color:var(--blue); text-align:center; padding:10px; margin-top:26px; }
  #records-filter-mock nav { display:flex; justify-content:space-between; gap:5px; border-top:1px solid var(--ink); padding:12px 8px; font-size:11px; }
  #records-filter-mock nav span { display:flex; flex-direction:column; align-items:center; gap:5px; }
  #records-filter-mock .selected { text-decoration:underline; text-underline-offset:4px; }
  #records-filter-mock p { margin:0; }
</style>
<div id="records-filter-mock">
  <div class="phone" aria-label="Records wireframe. Search on the left and Filter on the right share a row directly below All records, newest first.">
    <header><i data-lucide="menu" aria-hidden="true"></i><span>Wallet Manager</span></header>
    <div class="body">
      <div class="row"><span>Today · 13 Nov 2026</span><span class="muted">Today / Month</span></div>
      <div class="summary"><div class="row income"><span>Income</span><span>₹2,000.00</span></div><div class="row expense"><span>Expenses</span><span>₹400.00</span></div><div class="row"><span>Net</span><span>₹1,600.00</span></div></div>
      <p class="group muted">All records · newest first</p>
      <div class="toolbar">
        <div class="search"><i data-lucide="search" aria-hidden="true"></i><input data-search aria-label="Search description or amount" placeholder="Description or amount"></div>
        <button type="button" class="filter" data-filter aria-expanded="true" aria-controls="records-filter-options"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>Filter</span></button>
      </div>
      <div class="filter-panel" id="records-filter-options">
        <label>Category<select data-category><option value="">All categories</option><option>Food</option><option>Transport</option><option>Salary</option></select></label>
        <label>Day<input data-day type="date" aria-label="Filter by a particular day"></label>
        <label>Account / bank<select data-account><option value="">All accounts</option><option>Bank</option><option>Cash</option></select></label>
        <div class="row"><button type="button" data-reset>Clear filters</button><button type="button" data-apply>Apply filters</button></div>
      </div>
      <p class="muted">13 Nov 2026 · Today</p>
      <div class="item"><div class="row"><span class="category"><i data-lucide="car" aria-hidden="true"></i>Transport</span><span class="expense">− ₹150.00</span></div><p class="muted">17:15 · Bank · Cab</p></div>
      <div class="item"><div class="row"><span class="category"><i data-lucide="utensils" aria-hidden="true"></i>Food</span><span class="expense">− ₹250.00</span></div><p class="muted">13:30 · Cash · Lunch</p></div>
      <div class="item"><div class="row"><span class="category"><i data-lucide="briefcase" aria-hidden="true"></i>Salary</span><span class="income">+ ₹2,000.00</span></div><p class="muted">09:00 · Bank</p></div>
      <div class="add">+ Add record</div>
    </div>
    <nav aria-label="App navigation"><span class="selected"><i data-lucide="receipt" aria-hidden="true"></i>Records</span><span><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>Analysis</span><span><i data-lucide="wallet" aria-hidden="true"></i>Accounts</span><span><i data-lucide="tag" aria-hidden="true"></i>Categories</span></nav>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('records-filter-mock');
  const panel = root.querySelector('.filter-panel');
  const toggle = root.querySelector('[data-filter]');
  const search = root.querySelector('[data-search]');
  const category = root.querySelector('[data-category]');
  const day = root.querySelector('[data-day]');
  const account = root.querySelector('[data-account]');
  let applied = { category:'', day:'', account:'' };
  const records = [
    { category:'Transport', description:'Cab', amount:'150.00', account:'Bank', day:'2026-11-13' },
    { category:'Food', description:'Lunch', amount:'250.00', account:'Cash', day:'2026-11-13' },
    { category:'Salary', description:'', amount:'2000.00', account:'Bank', day:'2026-11-13' }
  ];
  function render() {
    const query = search.value.trim().toLowerCase();
    [...root.querySelectorAll('.item')].forEach((item, i) => {
      const r = records[i];
      item.hidden = !((!query || r.description.toLowerCase().includes(query) || r.amount.includes(query)) && (!applied.category || applied.category === r.category) && (!applied.day || applied.day === r.day) && (!applied.account || applied.account === r.account));
    });
  }
  toggle.addEventListener('click', () => { panel.hidden = !panel.hidden; toggle.setAttribute('aria-expanded', String(!panel.hidden)); });
  search.addEventListener('input', render);
  root.querySelector('[data-apply]').addEventListener('click', () => { applied = { category:category.value, day:day.value, account:account.value }; render(); panel.hidden = true; toggle.setAttribute('aria-expanded', 'false'); });
  root.querySelector('[data-reset]').addEventListener('click', () => { category.value = ''; day.value = ''; account.value = ''; applied = { category:'', day:'', account:'' }; render(); });
})();
</script>
